[project]
name = "ws-ephemeral"
version = "4.0.0rc1"
description = "request matching ephemeral port"
authors = [{ name = "Dhruvin Shah", email = "dhruvin3@gmail.com" }]
requires-python = ">=3.14"
dependencies = [
    "apscheduler>=3.11,<4",
    "httpx>=0.23.0",
    "pyotp>=2.9.0,<3",
    "qbittorrent-api>=2023.3.44",
    "semver>=3.0.0,<4",
    "typer>=0.15",
]

[project.scripts]
ws-ephemeral = "ws_ephemeral.cli:app"

[dependency-groups]
dev = [
    "prek>=0.5.6",
    "pyrefly>=0.40",
    "pytest>=8",
    "ruff>=0.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ws_ephemeral"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py314"
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
]
# long strings and docstrings are fine, `ruff format` handles the code
ignore = ["E501"]

[tool.pyrefly]
python-version = "3.14"
project-includes = ["src"]
search-path = ["src"]
