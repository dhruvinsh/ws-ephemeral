# Run with prek (https://github.com/j178/prek), install the git hook with:
#   uv run prek install
# Run on everything with:
#   uv run prek run --all-files
exclude: ^(LICENSE\.md|CHANGELOG\.md|uv\.lock)$

repos:
  - repo: builtin
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files

  # ruff and pyrefly come from the project environment (uv.lock), so the hooks
  # always run the same versions as `uv run ruff` / `uv run pyrefly`.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --frozen ruff check --fix --exit-non-zero-on-fix
        language: system
        types: [python]

      - id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format
        language: system
        types: [python]

      - id: pyrefly
        name: pyrefly check
        entry: uv run --frozen pyrefly check
        language: system
        types: [python]
        # type checking needs the whole project, not just the staged files
        pass_filenames: false

      - id: uv-lock
        name: uv lock is up to date
        entry: uv lock --check
        language: system
        files: ^(pyproject\.toml|uv\.lock)$
        pass_filenames: false
